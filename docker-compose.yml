# Isolated from werent-backend. Project name: ballot-ocr.
# Bind loopback only. Public traffic goes through Caddy.

name: ballot-ocr

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ballot-ocr:local
    container_name: ballot-ocr-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      PORT: "8000"
      DATA_DIR: /data
      BALLOT_DB_PATH: /data/ballot_ocr.db
      STORAGE_DIR: /data/storage
      CORS_ORIGINS: "*"
    volumes:
      - ballot-ocr-data:/data
    mem_limit: 1536m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  ballot-ocr-data:
